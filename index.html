<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="canonical" href="https://www.giftedcreates.com/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gifted — Creative Technologist fusing visual storytelling, design, engineering, and digital experiences. Explore a multidisciplinary portfolio." />
    <meta name="theme-color" content="#7700ff" />
    <meta name="author" content="Ibiam Iheanyi Victory" />
    <meta name="application-name" content="Gifted" />
    <meta name="msapplication-TileColor" content="#7700ff" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="Gifted | Creative Technologist" />
    <meta property="og:description" content="Multidisciplinary creative technologist combining visual storytelling, design, engineering, and digital experiences." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.giftedcreates.com/" />
    <meta property="og:image" content="https://www.giftedcreates.com/og-image.jpg" />
    <meta property="og:image:alt" content="Gifted World — Creative Portfolio" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Gifted" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gifted | Creative Technologist" />
    <meta name="twitter:description" content="Multidisciplinary creative technologist combining visual storytelling, design, engineering, and digital experiences." />
    <meta name="twitter:image" content="https://www.giftedcreates.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Gifted World — Creative Portfolio" />
    <meta name="twitter:site" content="@iheanyiibiam" />
    <meta name="twitter:creator" content="@iheanyiibiam" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Preload critical fonts -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />

    <title>Gifted | Creative Technologist</title>

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Gifted",
      "url": "https://www.giftedcreates.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://www.giftedcreates.com/favicon.png",
        "width": 180,
        "height": 180
      },
      "description": "Multidisciplinary creative technologist combining visual storytelling, design, engineering, and digital experiences.",
      "sameAs": [
        "https://github.com/Gifteddy/",
        "https://web.facebook.com/iheanyi.ibiam.3/",
        "https://www.instagram.com/iheanyiibiam1/",
        "https://www.tiktok.com/@iheanyiibiam"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "email": "ibiamiheanyi@gmail.com",
        "availableLanguage": "English"
      }
    }
    </script>

    <!-- JSON-LD: Person -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Ibiam Iheanyi Victory",
      "alternateName": "Gifted",
      "url": "https://www.giftedcreates.com",
      "jobTitle": "Creative Technologist",
      "description": "Multidisciplinary creative technologist combining visual storytelling, design, engineering, and digital experiences.",
      "sameAs": [
        "https://github.com/Gifteddy/",
        "https://web.facebook.com/iheanyi.ibiam.3/",
        "https://www.instagram.com/iheanyiibiam1/",
        "https://www.tiktok.com/@iheanyiibiam"
      ]
    }
    </script>

    <!-- JSON-LD: Website with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Gifted",
      "url": "https://www.giftedcreates.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.giftedcreates.com/blog?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD: BreadcrumbList for homepage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [{
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "https://www.giftedcreates.com/"
      }]
    }
    </script>

    <script>
      var theme = localStorage.getItem('gifted-theme');
      if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
